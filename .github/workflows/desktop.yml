name: desktop

on:
  push:
    branches: [main]
    # `push_tags` is not a GitHub event, so tag releases never ran. Path filters
    # are not evaluated for tag pushes, so every desktop-v* tag triggers.
    tags: ['desktop-v*']
    paths: ['desktop/**']
  workflow_dispatch:

jobs:
  # Fast gate on every desktop change: typecheck + unit tests + packaging dry-run.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: |
          npm ci || npm install
          (cd renderer && (npm ci || npm install))
      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Packaging dry-run
        working-directory: desktop
        run: npm run dist:dry

  # On a desktop-v* tag: build installers for both platforms → draft GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: |
          npm ci || npm install
          (cd renderer && (npm ci || npm install))
      - name: Build + package
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --publish always
