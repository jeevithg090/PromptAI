card_format: 1
id: claude
display_name: Claude
vendor: Anthropic
version: "2026-11-13.1"
verified_at: "2026-11-13"
review_by: "2027-02-13"
audience: private_ai
sources:
  - https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
  - https://platform.claude.com/docs/en/api/messages
claims:
  - id: xml-tags
    text: "Each kind of content gets its own XML tag: <task>, <context>, <constraints>, <documents>."
    quote: "XML tags help Claude parse complex prompts unambiguously, especially when your prompt mixes instructions, context, examples, and variable inputs."
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
  - id: documents-first
    text: "Long documents go at the top of the user turn, before the task."
    quote: "Place your long documents and inputs near the top of your prompt, above your query, instructions, and examples."
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
  - id: say-what-to-do
    text: "Exclusions are listed once, plainly; the rest of the brief says what to do."
    quote: "Tell Claude what to do instead of what not to do"
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
tos:
  insert_allowed: true
  note: "Insert pastes into Claude's message box and never sends. Terms not yet reviewed by counsel."
model:
  id: claude-opus-5-5
  note: "Default Opus per the Claude API skill (cached 2026-10-06). The API (version 2026-10-21) rejects temperature/top_p/top_k, so the card sends none."
surface: mixed          # system+user text for claude.ai paste, plus a Messages API body
accepts: [text, code, data]
family: text.chat
aliases: [claude.ai, claude desktop, com.anthropic.claudefordesktop]
insert: paste

slots:
  - id: audience
    label: Audience
    impact: 2
    to: audience
    default: a general audience
    options: [a general audience, beginners, experts, children, my team]
  - id: tone
    label: Tone
    impact: 1
    to: style.tone
    default: clear and direct
    options: [professional, friendly, encouraging, concise, playful, academic]
  - id: format
    label: Format
    impact: 1
    to: output.format
    default: markdown
    options: [markdown, plain prose, bullet list, table, json, code]

params:
  effort:
    type: string
    enum: [low, medium, high]
    note: "Maps to output_config.effort. Opus 5.5 defaults to medium, so the card always sends it."
    default: medium
  max_tokens:
    from: [tool_params.claude.max_tokens]
    type: integer
    min: 1
    max: 128000
    default: 16000

negation:
  strategy: inline
  note: "Claude docs: tell Claude what to do instead of what not to do. Exclusions are listed once, plainly."

ignores:
  /params/aspect_ratio: "Text model: aspect ratio is not a Claude setting."

fields:
  - name: system
    type: text
    description: "System prompt: role and calibration only (stable, cache-friendly)."
    template: |
      {%- if brief.role %}You are {{ brief.role | xml_text }}.{% else %}You are a careful, expert collaborator.{% endif %}
      {%- if brief.audience %} The work is for {{ brief.audience | xml_text }}; write at their level.{% endif %}
      {%- if brief.style.tone %} Tone: {{ brief.style.tone | join: ", " | xml_text }}.{% endif %}

  - name: user
    type: text
    required: true
    description: "User turn. Long documents first, then task, then rules (Claude prompting guide)."
    template: |
      {%- assign docs = brief.inputs | where: "content" -%}
      {%- if docs.size > 0 -%}
      <documents>
      {%- for d in docs %}
      <document index="{{ forloop.index }}">
      <source>{{ d.label | default: d.id | xml_text }}</source>
      <document_content>
      {{ d.content | xml_text }}
      </document_content>
      </document>
      {%- endfor %}
      </documents>
      {% endif %}
      {%- assign refs = brief.inputs | where: "ref" -%}
      {%- if refs.size > 0 %}
      <attachments>
      {%- for r in refs %}
      - {{ r.ref | xml_text }} ({{ r.role | replace: "_", " " }}{% if r.label %}: {{ r.label | xml_text }}{% endif %})
      {%- endfor %}
      </attachments>
      {% endif %}
      {%- if brief.context %}
      <context>
      {{ brief.context | bullets | xml_text }}
      </context>
      {% endif %}

      <task>
      {{ brief.goal | xml_text | sentence }}
      {%- if brief.subject and brief.subject != brief.goal %}
      Subject: {{ brief.subject | xml_text }}
      {%- endif %}
      {%- if brief.intent.deliverable.description %}
      Deliverable: {{ brief.intent.deliverable.description | xml_text }}
      {%- endif %}
      </task>
      {%- if brief.facets %}

      <details>
      {%- for ns in brief.facets %}{% for kv in ns[1] %}
      - {{ ns[0] }} {{ kv[0] | replace: "_", " " }}: {{ kv[1] | join: ", " | xml_text }}
      {%- endfor %}{% endfor %}
      </details>
      {%- endif %}
      {%- if brief.sections %}

      <outline>
      {%- for s in brief.sections %}
      {{ forloop.index }}. {{ s.label | xml_text }}{% if s.start_s != nil %} ({{ s.start_s }}-{{ s.end_s }}s){% endif %}: {{ s.text | xml_text }}
      {%- endfor %}
      </outline>
      {%- endif %}
      {%- if brief.constraints or neg.items %}

      <constraints>
      {%- for c in brief.constraints %}
      - {% if c.kind == "prefer" %}Preferred, not required: {% endif %}{{ c.text | xml_text }}
      {%- endfor %}
      {%- if neg.items %}
      - Leave out: {{ neg.items | join: ", " | xml_text }}
      {%- endif %}
      </constraints>
      {%- endif %}
      {%- if brief.style.descriptors or brief.style.references %}

      <style>
      {%- if brief.style.descriptors %}
      {{ brief.style.descriptors | join: ", " | xml_text }}
      {%- endif %}
      {%- if brief.style.references %}
      References: {{ brief.style.references | join: "; " | xml_text }}
      {%- endif %}
      </style>
      {%- endif %}
      {%- if brief.output %}

      <output_format>
      {%- if brief.output.format %}
      Format: {{ brief.output.format }}
      {%- endif %}
      {%- if brief.output.length %}
      Length: {% if brief.output.length.target %}about {{ brief.output.length.target }} {% endif %}{% if brief.output.length.min %}at least {{ brief.output.length.min }} {% endif %}{% if brief.output.length.max %}at most {{ brief.output.length.max }} {% endif %}{{ brief.output.length.unit }}
      {%- endif %}
      {%- if brief.output.structure %}
      Sections, in order: {{ brief.output.structure | join: "; " | xml_text }}
      {%- endif %}
      {%- if brief.output.language %}
      Language: {{ brief.output.language }}
      {%- endif %}
      {%- if brief.output.schema %}
      Return only JSON that validates against this JSON Schema:
      {{ brief.output.schema | json: 2 | xml_text }}
      {%- endif %}
      </output_format>
      {%- endif %}
      {%- if brief.examples %}

      <examples>
      {%- for e in brief.examples %}
      <example>
      {%- if e.input %}
      <input>{{ e.input | xml_text }}</input>
      {%- endif %}
      <output>{{ e.output | xml_text }}</output>
      {%- if e.note %}
      <note>{{ e.note | xml_text }}</note>
      {%- endif %}
      </example>
      {%- endfor %}
      </examples>
      {%- endif %}
      {%- if brief.success_criteria %}

      <success_criteria>
      Before you answer, check the result against each item:
      {{ brief.success_criteria | bullets | xml_text }}
      </success_criteria>
      {%- endif %}
      {%- if assumed %}

      <assumptions>
      I have not confirmed these. If one is wrong for the task, say so before you start:
      {{ assumed | bullets | xml_text }}
      </assumptions>
      {%- endif %}

  - name: paste
    type: text
    label: Message
    description: "Single message for claude.ai, which has no system field (what forge inserts)."
    template: |
      {{ out.system }}

      {{ out.user }}

  - name: api_request
    type: json
    description: "POST /v1/messages body (no sampling params; effort via output_config)."
    whitespace: preserve
    body:
      model: "{{ card.model }}"
      max_tokens: "=p.max_tokens"
      system: "=out.system"
      messages:
        - role: user
          content: "=out.user"
      output_config:
        effort: "=p.effort"

notes:
  - "XML-tag sections, examples in <example> tags, long documents at the top: from the Claude prompting best-practices page."
  - "Assumptions are passed downstream with an instruction to raise wrong ones (intent-elicitation.md, section 6)."
