card_format: 1
id: flux3
display_name: FLUX 3 Image (BFL API)
vendor: Black Forest Labs
version: "2026-11-10.1"
verified_at: "2026-11-10"
sources:
  - https://docs.bfl.ml/flux_3/flux3_image_generate.md
  - https://docs.bfl.ml/guides/prompting_unified_technical.md
  - https://docs.bfl.ml/api-reference/utility/generate-an-image-with-flux-3.md
model:
  id: flux-3-image
  note: "POST https://api.bfl.ai/v1/flux-3-image; unknown fields return HTTP 422, so the body is validated against the vendor schema before sending."
surface: api
accepts: [image]
family: image.generate
aliases: [flux 3, flux3, flux prompt, black forest labs]

slots:
  - id: style
    label: Style
    impact: 3
    to: facets.visual.medium
    options: [photorealistic, illustration, 3D render, anime, watercolor, oil painting]
  - id: lighting
    label: Lighting
    impact: 2
    to: facets.visual.lighting
    default: soft natural light
    options: [golden hour, soft studio, dramatic high-contrast, neon, overcast, night]
  - id: composition
    label: Framing
    impact: 2
    to: facets.visual.composition
    default: medium shot
    options: [close-up, medium shot, wide shot, overhead, low angle]
  - id: aspect_ratio
    label: Aspect ratio
    impact: 1
    to: params.aspect_ratio
    default: "1:1"
    options: ["1:1", "16:9", "9:16", "4:3", "4:5"]
    pattern: '\b(\d{1,2}:\d{1,2})\b'

params:
  aspect_ratio:
    type: string
    enum: ["21:9", "2:1", "16:9", "3:2", "7:5", "4:3", "5:4", "1:1", "4:5", "3:4", "5:7", "2:3", "9:16", "1:2", "9:21", "auto"]
    note: "15 fixed ratios or auto; auto without references gives 1:1, so set it for non-square requests."
  resolution:
    type: string
    enum: ["768sq", "1k", "1.5k", "2k", "4k"]
  grounding:
    from: [tool_params.flux3.grounding]
    type: boolean
    note: "Web/image-search grounding, default true."

negation:
  strategy: positive_rewrite
  note: "FLUX 3 Image has no negative_prompt field; describe what should be there instead (BFL technical-parameters guide)."
  rewrite:
    # from BFL's "common replacements" table
    people: "an empty, deserted scene"
    crowds: "a deserted setting"
    colors: "monochrome"
    text: "clean, unmarked surfaces"
    background clutter: "a plain studio backdrop in one color"
    modern elements: "period-accurate, traditional details"
    dark: "brightly lit"
    # authored for this spike (not from BFL)
    watermark: "a clean, unbranded image"
    harsh shadows: "soft, diffused shadows"
    logos: "unbranded surfaces"

ignores:
  /goal: "Image prompt: the subject carries the content."
  /audience: "Image models have no notion of audience."
  /role: "No persona channel."
  /constraints: "No instruction channel; a compile step must turn rules into description."
  /success_criteria: "Used by PromptAI's verifier only."
  /assumptions: "Shown in PromptAI only."
  /examples: "Not applicable."
  /output: "Image output."
  /context: "Not applicable."
  /intent/deliverable/description: "Covered by the subject."

fields:
  - name: prompt
    type: text
    required: true
    whitespace: single_line
    description: "Natural-language prompt, subject first; quote any text to render."
    template: |
      {%- assign order = "action,setting,composition,camera,lighting,mood,color,medium,detail" | split: "," -%}
      {{ brief.subject | default: brief.goal | sentence }}
      {%- for k in order %}{% if brief.facets.visual[k] %} {{ brief.facets.visual[k] | join: ", " | sentence }}{% endif %}{% endfor %}
      {%- if brief.style.descriptors %} {{ brief.style.descriptors | join: ", " | sentence }}{% endif %}
      {%- if brief.style.tone %} The mood is {{ brief.style.tone | join: ", " }}.{% endif %}
      {%- if brief.style.references %} In the style of {{ brief.style.references | join: " and " }}.{% endif %}
      {%- if neg.positive %} {{ neg.positive | join: ", " | sentence }}{% endif %}
      {%- if brief.facets.visual.text %} A sign that reads "{{ brief.facets.visual.text }}".{% endif %}

  - name: request
    type: json
    whitespace: preserve
    # Vendor request schema, extracted verbatim from components.schemas.Flux3ImageInputs of the BFL OpenAPI
    # (fetched 2026-11-10). Do not edit by hand; re-extract. Inline because core reads no files.
    schema: {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://promptai.local/vendor-schemas/bfl-flux3-image.request.json",
        "title": "Flux3ImageInputs",
        "description": "Extracted verbatim from components.schemas.Flux3ImageInputs of the BFL OpenAPI (fetched 2026-11-10). Do not edit by hand; re-extract.",
        "properties": {
          "user": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 256,
                "minLength": 1,
                "pattern": "^[^\\x00]*$"
              },
              {
                "type": "null"
              }
            ],
            "title": "User",
            "description": "Opaque identifier for the end user supplied by the calling platform."
          },
          "prompt": {
            "type": "string",
            "title": "Prompt",
            "description": "Free-form prompt describing the image."
          },
          "images": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              {
                "type": "null"
              }
            ],
            "title": "Images",
            "description": "Optional reference image(s) the prompt edits or draws from; each is an http(s) URL or base64, one to 10 total."
          },
          "aspect_ratio": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "21:9",
                  "2:1",
                  "16:9",
                  "3:2",
                  "7:5",
                  "4:3",
                  "5:4",
                  "1:1",
                  "4:5",
                  "3:4",
                  "5:7",
                  "2:3",
                  "9:16",
                  "1:2",
                  "9:21"
                ]
              },
              {
                "type": "string",
                "const": "auto"
              }
            ],
            "title": "Aspect Ratio",
            "description": "Output aspect ratio. Under `auto` a ratio the prompt asks for wins, otherwise the output keeps the first reference image's framing; without references the prompt decides, else 1:1.",
            "default": "auto"
          },
          "resolution": {
            "type": "string",
            "enum": [
              "768sq",
              "1k",
              "1.5k",
              "2k",
              "4k",
              "match_input"
            ],
            "title": "Resolution",
            "description": "Image resolution class, an equal-pixel-area tier: `768sq`, `1k` (default), `1.5k`, `2k`, or `4k`. Exact dimensions vary with the aspect ratio. `match_input` (edits only): the output keeps the first reference's own size (shrunk to 4 MP when larger), or its nearest tier when aspect_ratio is set. Ignored when width and height are set.",
            "default": "1k"
          },
          "width": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Width",
            "description": "Exact output width in pixels, [256, 6256]; set together with height. Overrides resolution and aspect_ratio."
          },
          "height": {
            "anyOf": [
              {
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Height",
            "description": "Exact output height in pixels, [256, 6256]; width x height at most 16822272 pixels, and at most 4194304 with reference images."
          },
          "safety_tolerance": {
            "type": "integer",
            "maximum": 7,
            "minimum": 0,
            "title": "Safety Tolerance",
            "description": "Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.",
            "default": 2
          },
          "grounding": {
            "type": "boolean",
            "title": "Grounding",
            "description": "When true (default) the prompt may be grounded in external research: web search and image search. When false, both are off.",
            "default": true
          },
          "version": {
            "type": "string",
            "const": "latest",
            "title": "Version",
            "description": "Endpoint version. `latest` (default) serves the current release; dated pinnable release tags are added here as they are published.",
            "default": "latest"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "prompt"
        ]
      }
    description: "POST /v1/flux-3-image body."
    body:
      prompt: "=out.prompt"
      aspect_ratio: "=p.aspect_ratio"
      resolution: "=p.resolution"
      grounding: "=p.grounding"
      images: "=brief.inputs | where: 'kind', 'image' | map: 'ref' | compact"
