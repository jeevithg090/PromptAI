appId: com.promptforge.desktop
productName: PromptForge
copyright: PromptForge (placeholder brand)
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
# Renderer + main are prebuilt into dist/ by `npm run build`.
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # NSMicrophoneUsageDescription is required for dictation (F1.3).
  extendInfo:
    NSMicrophoneUsageDescription: PromptForge uses the microphone only when you tap Dictate, to transcribe speech into the prompt box.
win:
  target:
    - nsis
    - portable
  # Unsigned by default — SmartScreen will warn until a code-signing cert is added.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  releaseType: release
